version: 2

updates:
  # Runtime dependencies. Grouped so the weekly PR count stays reviewable —
  # patch/minor land as one PR, majors come through individually since they
  # need real testing against a live Rust server.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Vendored tarball dependency, updated by hand.
      - dependency-name: "@liamcottle/rustplus.js"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # 2026.06.0 has no published builder image on ghcr.io (manifest unknown);
      # stay on 2026.02.1 until upstream publishes images again.
      - dependency-name: "home-assistant/builder"
        versions: [">2026.02.1"]
