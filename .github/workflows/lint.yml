name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      # Linting needs no native modules, so skip their builds.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run ESLint
        run: npm run lint
