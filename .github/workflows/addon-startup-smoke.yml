name: Add-on Startup Smoke Test

on:
  pull_request:
    branches:
      - main
      - dev/**
      - v2
      - v2-*
  push:
    branches:
      - main
      - dev/**
      - v2
      - v2-*
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its older, now-irrelevant runs.
# Runs on main are queued rather than cancelled so a release publish is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run startup smoke test
        run: |
          chmod +x scripts/ha_addon_smoke_test.sh
          ./scripts/ha_addon_smoke_test.sh
