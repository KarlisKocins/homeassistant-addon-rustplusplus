name: Add-on Startup Smoke Test

on:
  pull_request:
    branches:
      - main
      - dev/**
      - v2
      - v2-*
  push:
    branches:
      - main
      - dev/**
      - v2
      - v2-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run startup smoke test
        run: |
          chmod +x scripts/ha_addon_smoke_test.sh
          ./scripts/ha_addon_smoke_test.sh
