name: Builder

# Uses the composable home-assistant/builder actions that replaced the retired
# home-assistant/builder action. Images are only pushed for pushes to main; pull
# requests and manual runs build without publishing.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.image.outputs.image_name }}
      registry_prefix: ${{ steps.image.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
      publish: ${{ steps.image.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "."

      # config.yaml uses ghcr.io/<owner>/{arch}-<name>; the build actions want the
      # registry prefix and the bare name and add the "<arch>-" prefix themselves.
      - name: Split image name
        id: image
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ -z "${IMAGE}" || "${IMAGE}" == "null" ]]; then
            echo "::error::config.yaml has no image property"
            exit 1
          fi
          name="${IMAGE##*/}"
          echo "image_name=${name#\{arch\}-}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${IMAGE%/*}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.image.outputs.image_name }}
          registry-prefix: ${{ steps.image.outputs.registry_prefix }}

  build:
    # Job name kept as before so the "Build (amd64)" / "Build (aarch64)" checks keep their names
    name: Build (${{ matrix.arch }})
    needs: init
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # Push to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "."
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ needs.init.outputs.publish }}
          # A released version's image is never overwritten by later pushes to main
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: needs.init.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cosign signing
      packages: write # Push to GitHub Container Registry
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.init.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.init.outputs.image_name }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          registry-prefix: ${{ needs.init.outputs.registry_prefix }}
          skip-existing: ${{ needs.init.outputs.version }}
