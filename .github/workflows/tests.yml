name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev/**
      - v2
      - v2-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the `engines.node` floor in package.json; upper bound is
        # the current LTS the add-on base image tracks.
        node: ["20", "22"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # bcrypt and better-sqlite3 fall back to compiling from source when no
      # prebuild matches the runner.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  addon-lint:
    name: Add-on config lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports findings without blocking merges. config.yaml currently trips three
    # pre-existing rules ('startup', 'webui' and 'watchdog'); flip this off once
    # they are resolved so the lint starts gating.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      # Validates config.yaml / build.yaml against the Supervisor add-on schema
      # (options vs. schema consistency, arch list, image naming, ingress).
      - name: Lint add-on configuration
        uses: frenck/action-addon-linter@v2.21.0
        with:
          path: "./"
