name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - dev/**
      - v2
      - v2-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node` floor in package.json, which is the LTS the
        # add-on base image tracks (better-sqlite3 13 requires node >= 22).
        node: ["22"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # bcrypt and better-sqlite3 fall back to compiling from source when no
      # prebuild matches the runner.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test
