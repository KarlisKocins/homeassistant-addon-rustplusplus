name: RustPlusPlus Discord Bot
version: "2.5.1"
slug: rustplusplus
image: ghcr.io/karliskocins/{arch}-addon-rustplusplus
description: A Discord bot that connects to Rust game servers via the Rust+ Companion App
url: https://github.com/alexemanuelol/rustplusplus
arch:
  - aarch64
  - amd64
boot: manual
init: false
host_network: true
ingress: true
ingress_port: 3001
panel_icon: mdi:robot-industrial
panel_title: Rust++
# Kept deliberately. Add-on linters flag this as obsolete in favour of a Docker
# HEALTHCHECK, but the Supervisor's watchdog task reads this URL and nothing else:
# `watchdog_application()` returns True when no URL is set, and `_derive_state()` maps
# both HEALTHY and UNHEALTHY container states to STARTED. Removing this would silently
# disable auto-restart rather than move it. See issue #36.
watchdog: "http://[HOST]:[PORT:3001]/api/health"
options:
  discord_client_id: ""
  discord_token: ""
  log_level: info
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery: true
  battlemetrics_api_key: ""
  webui_enabled: false
  webui_port: 3001
  webui_password: ""
  database_path: "/data/statistics.db"
  positions_retention_days: 14
schema:
  discord_client_id: str
  discord_token: password
  log_level: list(debug|info|warning|error)?
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_discovery: bool?
  battlemetrics_api_key: password?
  webui_enabled: bool?
  webui_port: int?
  webui_password: password?
  database_path: str?
  positions_retention_days: int?
