name: RustPlusPlus Discord Bot
version: "1.2.22"
slug: rustplusplus
image: ghcr.io/karliskocins/{arch}-addon-rustplusplus
description: A Discord bot that connects to Rust game servers via the Rust+ Companion App
url: https://github.com/alexemanuelol/rustplusplus
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
host_network: true
options:
  discord_client_id: ""
  discord_token: ""
  log_level: info
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery: true
  webui_enabled: false
  webui_port: 3001
  database_path: "/data/statistics.db"
schema:
  discord_client_id: str
  discord_token: password
  log_level: list(debug|info|warning|error)?
  mqtt_host: str?
  mqtt_port: int?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_discovery: bool?
  webui_enabled: bool?
  webui_port: int?
  database_path: str?
